[package]
name = "persistence-pg"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[dependencies]
hex = "0.4"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sim-core = { path = "../sim-core" }
thiserror = "2"

[dev-dependencies]
world-data = { path = "../world-data" }
