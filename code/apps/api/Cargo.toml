[package]
name = "wdex-api"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-core = { path = "../../crates/sim-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
